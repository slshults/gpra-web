# Dependabot configuration for GPRA
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# RESTRICTED: Only tracks posthog-python SDK updates.
# All other pip, npm, and GitHub Actions dependencies are managed manually.
# This minimizes PR noise and supply chain attack surface.

version: 2
updates:
  # Python pip - posthog-python SDK only
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    # Propose a release once it's a day old, not seven: the 7-day wait is on
    # merging instead. Dependabot still runs weekly, so a PR opens on the
    # Monday after a release. dependabot-auto-merge.yml merges it only once
    # the release is 7 days old, and dependabot-recheck.yml re-runs that check
    # every 6 hours until then. (PostHog's Shai-Hulud post-mortem suggests
    # waiting at least 3 days.) The one day keeps next Monday's run from
    # replacing a PR just before it would merge. Security updates skip the
    # cooldown.
    cooldown:
      default-days: 1
    target-branch: "main"
    allow:
      - dependency-name: "posthog"
    commit-message:
      prefix: "deps(pip)"
    labels:
      - "dependencies"
      - "python"
