# Dependabot configuration for GPRA
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# RESTRICTED: Only tracks posthog-python SDK updates.
# All other pip, npm, and GitHub Actions dependencies are managed manually.
# This minimizes PR noise and supply chain attack surface.

version: 2
updates:
  # Python pip - posthog-python SDK only
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    # Wait 7 days after a release before proposing it, so a bad or
    # compromised release has time to be caught and yanked (PostHog's
    # Shai-Hulud post-mortem suggests at least 3; GitHub's default is 3).
    # Security updates skip the cooldown. To take a version sooner, bump
    # requirements.txt by hand.
    cooldown:
      default-days: 7
    target-branch: "main"
    allow:
      - dependency-name: "posthog"
    commit-message:
      prefix: "deps(pip)"
    labels:
      - "dependencies"
      - "python"
