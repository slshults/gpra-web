# Auto-approve and auto-merge Dependabot PRs for posthog-python updates
# Since we restrict Dependabot to ONLY posthog-python (see dependabot.yml),
# all semver types (patch, minor, major) are auto-merged, once the release
# has been on PyPI for 7 days. Dependabot proposes a release once it's a
# day old, on its weekly run; dependabot-recheck.yml re-runs this workflow
# every 6 hours until the release is old enough.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
#
# Needs two repo settings: Settings > Actions > General > "Allow GitHub
# Actions to create and approve pull requests", and Settings > General >
# "Allow auto-merge".

name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

# One run per PR at a time, so a withdraw can't race an approve.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only on PRs Dependabot opened, from a branch in this repo (not a fork),
    # and only in slshults/gpra-web itself (not in a copy someone forked).
    # Who triggered the event is checked in the first step instead, so that
    # a push by anyone else still reaches the withdraw step at the end.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.repository == 'slshults/gpra-web'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Safety check: only auto-merge if the dependency is posthog from pip.
      # This is defense-in-depth alongside the dependabot.yml allow filter.
      - name: Verify dependency is posthog
        id: verify
        env:
          # Passed through env, not interpolated into the script, so a value
          # can never be run as shell code.
          DEP_NAME: ${{ steps.metadata.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          # github.actor is whoever triggered this event, which isn't always
          # the PR's author. A re-run keeps the original actor.
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$ACTOR" == "dependabot[bot]" && "$DEP_NAME" == "posthog" && "$ECOSYSTEM" == "pip" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not a pip posthog update - skipping auto-merge"
          fi

      # fetch-metadata only reads the PR's first commit, so also check what
      # the PR as a whole changes: exactly one file, requirements.txt, and
      # nothing but the posthog== pin line. Then check the release's age.
      - name: Verify the diff is only the posthog pin
        id: diff
        if: steps.verify.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files_json=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files")
          files=$(jq -r '.[].filename' <<< "$files_json")
          if [[ "$files" != "requirements.txt" ]]; then
            echo "::warning::PR changes files other than requirements.txt - skipping auto-merge"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The API's patch has no +++/--- file headers, so every line that
          # starts with + or - is a real change.
          changed=$(jq -r '.[0].patch // ""' <<< "$files_json" | grep -E '^[+-]' || true)
          adds=$(grep -c '^+' <<< "$changed" || true)
          dels=$(grep -c '^-' <<< "$changed" || true)
          if [[ "$adds" != "1" || "$dels" != "1" ]] \
            || grep -Evq '^[+-]posthog==[0-9]+(\.[0-9]+)*$' <<< "$changed"; then
            echo "::warning::requirements.txt changes more than the posthog pin - skipping auto-merge"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Merge only a release that has been on PyPI at least 7 days, every
          # file of it, and isn't yanked. Until then dependabot-recheck.yml
          # re-runs this workflow every 6 hours.
          version=$(grep '^+' <<< "$changed"); version=${version#+posthog==}
          cutoff=$(( $(date -u +%s) - 7 * 86400 ))
          if ! doc=$(curl -fsS --max-time 30 "https://pypi.org/pypi/posthog/$version/json"); then
            echo "::warning::couldn't read posthog $version on PyPI - skipping auto-merge"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e --arg v "$version" --argjson cutoff "$cutoff" '
              .info.version == $v and (.urls | length) > 0
              and all(.urls[]; .yanked == false
                and ((.upload_time_iso_8601 | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) <= $cutoff))
            ' <<< "$doc" > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::posthog $version isn't 7 days old on PyPI yet (or PyPI's record didn't check out) - waiting; dependabot-recheck.yml will try again"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Approve and merge only the exact commit this run checked, so a later
      # push to the branch can't ride along on this approval.
      - name: Auto-approve PR
        if: steps.verify.outputs.allowed == 'true' && steps.diff.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$HEAD_SHA" > /dev/null

      - name: Auto-merge PR
        if: steps.verify.outputs.allowed == 'true' && steps.diff.outputs.ok == 'true'
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If this run didn't pass its checks, take back anything an earlier run
      # did for an older commit on this PR: auto-merge stays armed across
      # Dependabot's force-pushes, and an approval may too.
      - name: Withdraw earlier approval and auto-merge
        if: always() && (steps.verify.outputs.allowed != 'true' || steps.diff.outputs.ok != 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          approvals() {
            local out
            out=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id') \
              || { echo "::error::Couldn't read the PR's reviews"; exit 1; }
            grep -E '^[0-9]+$' <<< "$out" || true
          }
          gh pr merge --disable-auto "$PR_URL" 2>/dev/null || true
          for id in $(approvals); do
            gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$id/dismissals" \
              -f message="Checks didn't pass on the newest commit" -f event=DISMISS > /dev/null \
              || echo "::warning::couldn't dismiss review $id"
          done
          # Fail loudly if anything is still armed, so the run shows red.
          left=""
          [[ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" == "false" ]] \
            || left="auto-merge is still on"
          remaining=$(approvals) || remaining="couldn't check"
          [[ -z "$remaining" ]] || left="${left:+$left, }a bot approval may still be there"
          if [[ -n "$left" ]]; then echo "::error::Couldn't withdraw: $left"; exit 1; fi
