# fail2ban action: send a `fail2ban_ban` event to GPRA's PostHog project.
#
# It passes the jail name and fail2ban's own ban counters to
# posthog-ban-event.sh, and never the banned address (<ip>), so no address
# can reach PostHog. Add it to a jail's action list next to the action that
# does the actual blocking; it doesn't block anything itself.
#
# Install as /etc/fail2ban/action.d/posthog-ban-event.conf, with the script
# at /usr/local/bin/posthog-ban-event.sh. A jail can point it at another env
# file with: posthog-ban-event[envfile="/path/to/.env"]

[Definition]

actionstart =
actionstop =
actioncheck =

# <bantime> and <bancount> are this ban's values, including any increase from
# bantime.increment (fail2ban 0.11 and later).
actionban = <script> '<envfile>' '<name>' '<bantime>' '<bancount>' '<failures>'

actionunban =

[Init]

script = /usr/local/bin/posthog-ban-event.sh
envfile = /var/www/gpra-web/.env
